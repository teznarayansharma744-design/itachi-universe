name: itachi_universe
description: Premium course streaming app with device-locked keys.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  video_player: ^2.9.1
  http: ^1.2.2
  android_id: ^0.4.0
  crypto: ^3.0.3
  youtube_player_iframe: ^6.0.0
  pdfx: ^2.9.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
