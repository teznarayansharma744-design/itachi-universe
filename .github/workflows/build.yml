name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Creates the android/ folder; existing lib/ and pubspec.yaml are kept.
      - name: Create Android project files
        run: flutter create . --platforms=android --project-name itachi_universe --org com.itachi

      - name: Allow internet in release builds
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      # Keep the signing key the same for every build. The phone's Android ID (used for the
      # Device ID) depends on it, and so does installing a new APK over the old one.
      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: App name and logo
        run: |
          sed -i 's#android:label="[^"]*"#android:label="Itachi Universe"#' android/app/src/main/AndroidManifest.xml
          cp -r ci/icons/* android/app/src/main/res/

      # The Android lint check can crash inside plugins and it does not change the APK.
      - name: Skip the lint check
        run: |
          cat >> android/build.gradle.kts <<'EOF2'

          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          EOF2

      - run: flutter pub get

      - run: flutter build apk --release --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: itachi-universe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
